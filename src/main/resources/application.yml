server:
  port: 8082

spring:
  application:
    name: TravelProject
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/travel_guide_platform?useSSL=false&serverTimezone=UTC
    username: root
    password: 123321
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp


logging:
  level:
    com:
      travel:
        mapper: debug
        service: info
        controller: info
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.travel.entity
  configuration:
    map-underscore-to-camel-case: true

