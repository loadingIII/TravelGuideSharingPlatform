services:
  backend:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: travel-backend
    restart: unless-stopped
    ports:
      - "8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      mysql.username: root
      mysql.password: ${MYSQL_ROOT_PASSWORD}
      mysql.url: jdbc:mysql://host.docker.internal:3306/travel_guide_platform?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf-8
      jwt.secret: ${JWT_SECRET}
      oss.endpoint: ${OSS_ENDPOINT}
      oss.access-key-id: ${OSS_ACCESS_KEY_ID}
      oss.access-key-secret: ${OSS_ACCESS_KEY_SECRET}
      oss.bucket-name: ${OSS_BUCKET_NAME}
