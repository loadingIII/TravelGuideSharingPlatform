services:
  backend:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: travel-backend
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      mysql.username: root
      mysql.password: ${MYSQL_ROOT_PASSWORD}
      mysql.url: jdbc:mysql://${MYSQL_HOST:?请设置MYSQL_HOST为本机IP}:3306/travel_guide_platform?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf-8
      jwt.secret: ${JWT_SECRET}
      oss.endpoint: ${OSS_ENDPOINT}
      oss.access-key-id: ${OSS_ACCESS_KEY_ID}
      oss.access-key-secret: ${OSS_ACCESS_KEY_SECRET}
      oss.bucket-name: ${OSS_BUCKET_NAME}
