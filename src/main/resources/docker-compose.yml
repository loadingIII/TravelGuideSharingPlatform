services:
  mysql:
    image: mysql:8
    container_name: travel-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: travel_guide_platform
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./static/SqlData/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - travel-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=50

  backend:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: travel-backend
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      mysql.username: root
      mysql.password: ${MYSQL_ROOT_PASSWORD}
      mysql.url: jdbc:mysql://mysql:3306/travel_guide_platform?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf-8
      jwt.secret: ${JWT_SECRET}
      oss.endpoint: ${OSS_ENDPOINT}
      oss.access-key-id: ${OSS_ACCESS_KEY_ID}
      oss.access-key-secret: ${OSS_ACCESS_KEY_SECRET}
      oss.bucket-name: ${OSS_BUCKET_NAME}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - travel-network

volumes:
  mysql-data:

networks:
  travel-network:
    driver: bridge
