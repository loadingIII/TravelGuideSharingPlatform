<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>攻略后台管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css?v=2">
  <link rel="stylesheet" href="css/layout.css?v=2">
  <link rel="stylesheet" href="css/components.css?v=2">
  <link rel="stylesheet" href="css/pages.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <div class="app" id="app"><div class="loading">加载中...</div></div>
  <script src="js/api.js?v=2"></script>
  <script src="js/router.js?v=2"></script>
  <script src="js/components.js?v=2"></script>
  <script src="js/pages/dashboard.js?v=2"></script>
  <script src="js/pages/users.js?v=2"></script>
  <script src="js/pages/guides.js?v=2"></script>
  <script src="js/pages/stories.js?v=2"></script>
  <script src="js/pages/destinations.js?v=2"></script>
  <script src="js/pages/comments.js?v=2"></script>
  <script src="js/pages/staff.js?v=2"></script>
  <script>
    Router.register('/', params => { setupLayout('数据总览', ''); initDashboard(); });
    Router.register('/users', params => { setupLayout('用户管理', 'users'); initUsers(); });
    Router.register('/users/detail/:id', params => { setupLayout('用户管理', 'users'); initUserDetail(params.id); });
    Router.register('/guides', params => { setupLayout('攻略管理', 'guides'); initGuides(); });
    Router.register('/guides/detail/:id', params => { setupLayout('攻略管理', 'guides'); initGuideDetail(params.id); });
    Router.register('/stories', params => { setupLayout('故事管理', 'stories'); initStories(); });
    Router.register('/stories/detail/:id', params => { setupLayout('故事管理', 'stories'); initStoryDetail(params.id); });
    Router.register('/destinations', params => { setupLayout('目的地管理', 'destinations'); initDestinations(); });
    Router.register('/destinations/detail/:id', params => { setupLayout('目的地管理', 'destinations'); initDestinationDetail(params.id); });
    Router.register('/destinations/edit/:id', params => { setupLayout('目的地管理', 'destinations'); initDestinationEdit(params.id); });
    Router.register('/comments', params => { setupLayout('评论管理', 'comments'); initComments(); });
    Router.register('/destinations/create', params => { setupLayout('目的地管理', 'destinations'); initDestinationCreate(); });
    Router.register('/guides/create', params => { setupLayout('攻略管理', 'guides'); initGuideCreate(); });
    Router.register('/stories/create', params => { setupLayout('故事管理', 'stories'); initStoryCreate(); });
    Router.register('/staff', params => { setupLayout('员工管理', 'staff'); initStaff(); });
    Router.start();
  </script>
</body>
</html>
